name: Build and publish frontend image

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/marvsman/afterstream

jobs:
  build:
    name: Build and publish frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PWA_ENABLED=true
            APP_DOMAIN=https://watch.marvsman.pro
            NORMAL_ROUTER=true
            BACKEND_URL=https://watch-api.marvsman.pro
            CORS_PROXY_URL=${{ vars.AFTERSTREAM_CORS_PROXY_URL }}
            M3U8_PROXY_URL=${{ vars.AFTERSTREAM_M3U8_PROXY_URL }}
            TMDB_READ_API_KEY=${{ secrets.TMDB_READ_API_KEY }}
            USE_TRAKT=${{ vars.AFTERSTREAM_USE_TRAKT }}
            TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
            TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
            TRAKT_REDIRECT_URI=https://watch.marvsman.pro
          cache-from: type=gha
          cache-to: type=gha,mode=max
