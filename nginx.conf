server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # AfterStream is a client-side SPA. Serve index.html for deep links so
    # direct movie/show URLs and browser refreshes reach React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep static assets cacheable while allowing HTML/config updates through.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
